<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Cake Studio - Premium Bakery</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #fff5f7; color: #333; padding-bottom: 40px; }
        
        header {
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            color: white; text-align: center; padding: 35px 20px;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 78, 80, 0.2);
        }
        header h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; margin-bottom: 8px; }
        header p { font-size: 0.95rem; opacity: 0.95; font-weight: 500; }

        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }

        .card {
            background: white; border-radius: 24px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 20px;
            border: 1px solid #ffe6eb;
        }

        .section-title { font-size: 1.3rem; color: #ff4e50; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

        /* Gallery Preview */
        .cake-preview-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px;
        }
        .cake-thumb {
            border-radius: 16px; overflow: hidden; height: 110px; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 2px solid transparent; transition: 0.3s;
        }
        .cake-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .cake-thumb span {
            position: absolute; bottom: 0; background: rgba(0,0,0,0.6); color: white;
            width: 100%; font-size: 0.75rem; text-align: center; padding: 3px; font-weight: 600;
        }

        label { font-size: 0.85rem; font-weight: 600; color: #444; display: block; margin: 14px 0 6px; }
        
        select, input, textarea {
            width: 100%; padding: 14px 16px; border-radius: 14px;
            border: 1.5px solid #eee; background: #fafafa; font-size: 0.95rem;
            outline: none; transition: 0.3s; color: #333;
        }
        select:focus, input:focus, textarea:focus { border-color: #ff4e50; background: #fff; box-shadow: 0 0 0 4px rgba(255, 78, 80, 0.1); }

        .price-box {
            background: linear-gradient(135deg, #fff0f3, #ffe3e8); border: 2px dashed #ff4e50; border-radius: 18px;
            padding: 18px; text-align: center; margin-top: 25px;
        }
        .price-box p { font-size: 0.85rem; color: #666; font-weight: 500; }
        .price-box span { font-size: 2rem; font-weight: 700; color: #ff4e50; }

        .btn-order {
            width: 100%; background: linear-gradient(135deg, #25D366, #1ebe5d); color: white; border: none;
            padding: 16px; border-radius: 16px; font-size: 1.1rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 20px; cursor: pointer; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
            transition: 0.2s;
        }
        .btn-order:active { transform: scale(0.97); }

        .footer-note { text-align: center; font-size: 0.8rem; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>🎂 Royal Cake Studio</h1>
        <p>Fresh, Delicious & Customized Cakes Delivered Fresh</p>
    </header>

    <div class="container">
        
        <!-- Popular Cakes Gallery Preview -->
        <div class="card" style="padding: 18px;">
            <h3 class="section-title" style="font-size: 1.1rem; margin-bottom: 12px;">✨ Our Special Cakes</h3>
            <div class="cake-preview-grid">
                <div class="cake-thumb">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300" alt="Chocolate Cake">
                    <span>Dutch Chocolate</span>
                </div>
                <div class="cake-thumb">
                    <img src="https://images.unsplash.com/photo-1586788680344-d26d8479dccb?w=300" alt="Red Velvet">
                    <span>Red Velvet</span>
                </div>
                <div class="cake-thumb">
                    <img src="https://images.unsplash.com/photo-1535141192574-5d4897c13136?w=300" alt="Butterscotch">
                    <span>Butterscotch</span>
                </div>
                <div class="cake-thumb">
                    <img src="https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" alt="Fruit Cake">
                    <span>Fresh Fruit</span>
                </div>
            </div>
        </div>

        <!-- Order Form Card -->
        <div class="card">
            <h2 class="section-title">🛒 Customize & Order</h2>

            <!-- Cake Type -->
            <label>Select Cake Flavor</label>
            <select id="flavor" onchange="calculatePrice()">
                <option value="Dutch Chocolate" data-price="500">Dutch Chocolate (₹500 / 0.5kg)</option>
                <option value="Vanilla Strawberry" data-price="450">Vanilla Strawberry (₹450 / 0.5kg)</option>
                <option value="Red Velvet" data-price="600">Red Velvet (₹600 / 0.5kg)</option>
                <option value="Butterscotch" data-price="450">Butterscotch (₹450 / 0.5kg)</option>
                <option value="Fresh Fruit Cake" data-price="550">Fresh Fruit Cake (₹550 / 0.5kg)</option>
            </select>

            <!-- Weight -->
            <label>Select Weight</label>
            <select id="weight" onchange="calculatePrice()">
                <option value="0.5 kg" data-multiplier="1">0.5 kg</option>
                <option value="1 kg" data-multiplier="1.9">1 kg (Best Value)</option>
                <option value="1.5 kg" data-multiplier="2.8">1.5 kg</option>
                <option value="2 kg" data-multiplier="3.6">2 kg (Party Pack)</option>
            </select>

            <!-- Message on Cake -->
            <label>Text on Cake (Optional)</label>
            <input type="text" id="cakeText" placeholder="e.g. Happy Birthday Rahul!">

            <!-- Delivery Date & Time -->
            <label>Delivery Date</label>
            <input type="date" id="deliveryDate">

            <label>Preferred Time Slot</label>
            <select id="deliveryTime">
                <option value="Morning (10 AM - 1 PM)">Morning (10 AM - 1 PM)</option>
                <option value="Afternoon (2 PM - 5 PM)">Afternoon (2 PM - 5 PM)</option>
                <option value="Evening (6 PM - 9 PM)">Evening (6 PM - 9 PM)</option>
                <option value="Midnight Special (11:30 PM)">Midnight Special (11:30 PM)</option>
            </select>

            <!-- Customer Details -->
            <label>Your Name</label>
            <input type="text" id="custName" placeholder="Aapka poora naam">

            <label>Delivery Address & Landmark</label>
            <textarea id="custAddress" rows="2" placeholder="House no, Colony, Landmark"></textarea>

            <!-- Total Price -->
            <div class="price-box">
                <p>Total Estimated Amount</p>
                <span id="totalPrice">₹500</span>
            </div>

            <!-- WhatsApp Button -->
            <button class="btn-order" onclick="sendWhatsAppOrder()">
                📱 Send Order via WhatsApp
            </button>
        </div>
        
        <p class="footer-note">⚡ Fast & Fresh Home Delivery Available</p>
    </div>

    <script>
        function calculatePrice() {
            let flavorSelect = document.getElementById('flavor');
            let basePrice = parseInt(flavorSelect.options[flavorSelect.selectedIndex].getAttribute('data-price'));
            
            let weightSelect = document.getElementById('weight');
            let multiplier = parseFloat(weightSelect.options[weightSelect.selectedIndex].getAttribute('data-multiplier'));

            let finalPrice = Math.round(basePrice * multiplier);
            document.getElementById('totalPrice').innerText = '₹' + finalPrice;
        }

        function sendWhatsAppOrder() {
            // ⚠️ APNA WHATSAPP NUMBER YAHAN CHANGE KAREIN (e.g., 919876543210)
            let shopPhoneNumber = "919876543210";

            let flavor = document.getElementById('flavor').value;
            let weight = document.getElementById('weight').value;
            let cakeText = document.getElementById('cakeText').value || "None";
            let date = document.getElementById('deliveryDate').value;
            let time = document.getElementById('deliveryTime').value;
            let name = document.getElementById('custName').value;
            let address = document.getElementById('custAddress').value;
            let price = document.getElementById('totalPrice').innerText;

            if(!name || !address || !date) {
                alert("Kripya Naam, Address aur Delivery Date zaroor bharein!");
                return;
            }

            let message = `Hello! Mujhko ek cake order karna hai:%0A%0A` +
                `🎂 *Flavor:* ${flavor}%0A` +
                `⚖️ *Weight:* ${weight}%0A` +
                `✍️ *Text on Cake:* ${cakeText}%0A` +
                `📅 *Delivery Date:* ${date}%0A` +
                `⏰ *Time Slot:* ${time}%0A%0A` +
                `👤 *Customer Name:* ${name}%0A` +
                `📍 *Address:* ${address}%0A` +
                `💰 *Total Price:* ${price}`;

            let url = `https://wa.me/${shopPhoneNumber}?text=${message}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>

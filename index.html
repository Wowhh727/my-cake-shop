<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Cake Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #fff; padding-bottom: 50px; }
        header { background: linear-gradient(135deg, #ff4e50, #f9d423); text-align: center; padding: 30px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        header h1 { font-size: 2rem; margin-bottom: 5px; }
        .container { max-width: 480px; margin: 20px auto; padding: 0 15px; }
        .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        label { font-size: 0.85rem; color: #cbd5e1; display: block; margin: 12px 0 5px; font-weight: 600; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #334155; background: #1e293b; color: #fff; font-size: 0.95srem; outline: none; }
        .price-box { background: rgba(236, 72, 153, 0.1); border: 1px dashed #ec4899; border-radius: 15px; padding: 15px; text-align: center; margin-top: 20px; }
        .price-box span { font-size: 2rem; font-weight: 700; color: #f472b6; }
        .btn-order { width: 100%; background: #22c55e; color: white; border: none; padding: 15px; border-radius: 14px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .admin-btn-link { text-align: center; margin-top: 30px; font-size: 0.8rem; color: #94a3b8; cursor: pointer; text-decoration: underline; }
        
        /* Admin Modal */
        #adminModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; padding: 20px; overflow-y: auto; }
        .admin-content { background: #1e293b; border-radius: 20px; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ec4899; }
    </style>
</head>
<body>

    <header>
        <h1>🎂 Royal Cake Studio</h1>
        <p>Fresh & Delicious Cakes</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>🛒 Place Order</h2>

            <label>Select Cake Flavor</label>
            <select id="flavor" onchange="calculateTotal()">
                <option value="Dutch Chocolate" data-price="500">Dutch Chocolate - ₹500 (0.5kg)</option>
                <option value="Red Velvet" data-price="600">Red Velvet - ₹600 (0.5kg)</option>
                <option value="Butterscotch" data-price="450">Butterscotch - ₹450 (0.5kg)</option>
                <option value="Fresh Fruit" data-price="550">Fresh Fruit - ₹550 (0.5kg)</option>
            </select>

            <label>Select Weight</label>
            <select id="weight" onchange="calculateTotal()">
                <option value="0.5 kg" data-mul="1">0.5 kg</option>
                <option value="1 kg" data-mul="1.9">1 kg</option>
                <option value="1.5 kg" data-mul="2.8">1.5 kg</option>
                <option value="2 kg" data-mul="3.6">2 kg</option>
            </select>

            <label>Message on Cake</label>
            <input type="text" id="cakeText" placeholder="e.g. Happy Birthday">

            <label>Delivery Date</label>
            <input type="date" id="deliveryDate">

            <label>Your Name</label>
            <input type="text" id="custName" placeholder="Aapka naam">

            <label>Delivery Address</label>
            <textarea id="custAddress" rows="2" placeholder="Poora address"></textarea>

            <div class="price-box">
                <p>Total Amount</p>
                <span id="totalPrice">₹500</span>
            </div>

            <button class="btn-order" onclick="sendOrder()">📱 Send Order on WhatsApp</button>
        </div>

        <div class="admin-btn-link" onclick="openAdmin()">⚙️ Open Admin Control Panel</div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal">
        <div class="admin-content">
            <h2>⚙️ Admin Panel</h2>
            <label>Maintenance Mode</label>
            <button style="background:#eab308; color:#000; border:none; padding:10px; width:100%; border-radius:8px; font-weight:bold; margin-top:5px;" onclick="alert('Maintenance mode toggled!')">Toggle Maintenance</button>
            
            <br><br>
            <button style="background:#ef4444; color:#fff; border:none; padding:10px; width:100%; border-radius:8px; font-weight:bold;" onclick="closeAdmin()">Close Panel</button>
        </div>
    </div>

    <script>
        function calculateTotal() {
            let flavor = document.getElementById('flavor');
            let price = parseInt(flavor.options[flavor.selectedIndex].getAttribute('data-price'));
            let weight = document.getElementById('weight');
            let mul = parseFloat(weight.options[weight.selectedIndex].getAttribute('data-mul'));
            
            let final = Math.round(price * mul);
            document.getElementById('totalPrice').innerText = '₹' + final;
        }

        function openAdmin() {
            let p = prompt("Enter Admin Password (admin123):");
            if(p === "admin123") {
                document.getElementById('adminModal').style.display = 'block';
            } else if(p !== null) {
                alert("Wrong password!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function sendOrder() {
            let phone = "919876543210"; // Apna WhatsApp number yahan daalein
            let flavor = document.getElementById('flavor').value;
            let weight = document.getElementById('weight').value;
            let text = document.getElementById('cakeText').value || "None";
            let date = document.getElementById('deliveryDate').value;
            let name = document.getElementById('custName').value;
            let address = document.getElementById('custAddress').value;
            let price = document.getElementById('totalPrice').innerText;

            if(!name || !address || !date) {
                alert("Kripya Naam, Address aur Date bharein!");
                return;
            }

            let msg = `Hello! Order Details:%0A- Flavor: ${flavor}%0A- Weight: ${weight}%0A- Text: ${text}%0A- Date: ${date}%0A- Name: ${name}%0A- Address: ${address}%0A- Total: ${price}`;
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>

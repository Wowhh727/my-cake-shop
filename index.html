            <option value="Online">Online Payment (Razorpay / UPI)</option>
        </select>

        <!-- UPI QR Code Box (Initially Hidden) -->
        <div id="qrCodeContainer" style="display: none; text-align: center; margin-top: 15px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);">
            <p style="font-size: 0.8rem; color: #f472b6; margin-bottom: 8px;">Scan & Pay via any UPI App</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=6001785308@ptsbi&pn=Priyatam%20Cake%20Studio&am=0&cu=INR" alt="UPI QR Code" style="width: 140px; height: 140px; border-radius: 10px; background: #fff; padding: 6px;">
            <p style="font-size: 0.75rem; color: #94a3b8; margin-top: 8px;">UPI ID: <strong>6001785308@ptsbi</strong></p>
            <label style="margin-top: 10px;">Enter Transaction ID / UTR</label>
            <input type="text" id="utrInput" placeholder="e.g. 3342xxxxxxxx" style="text-align: center;">
        </div>

        <div class="price-box">
            <p>Total Payable Amount</p>
            <span id="totalPriceDisplay">₹0</span>
        </div>

        <button class="btn-order" onclick="sendWhatsAppOrder()"><i class="fab fa-whatsapp"></i> Order via WhatsApp</button>
    </div>

    <div class="footer-text">
        <p>&copy; 2026 Priyatam Cake Studio. All rights reserved.</p>
    </div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="floating-cart" onclick="openCartModal()">
        <div class="cart-left">
            <i class="fas fa-shopping-bag"></i> View Bag
            <span class="cart-badge" id="floatingCartCount">0</span>
        </div>
        <div id="floatingCartTotal" style="font-weight: 800; font-size: 1rem;">₹0</div>
    </div>

    <a href="https://wa.me/916001785308" target="_blank" class="floating-support"><i class="fab fa-whatsapp"></i></a>

    <!-- CART MODAL -->
    <div id="cartModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-bag"></i> Your Shopping Bag</h3>
                <button class="close-btn" onclick="closeCartModal()">×</button>
            </div>
            <div id="cartItemsContainer" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
            <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; margin-bottom: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                <span>Subtotal:</span>
                <span id="cartModalTotal">₹0</span>
            </div>
            <button class="btn-order" style="margin-top: 0; padding: 14px;" onclick="proceedToCheckout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- ORDER TRACKER MODAL -->
    <div id="trackerModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-search-location"></i> Track Your Order</h3>
                <button class="close-btn" onclick="closeTrackerModal()">×</button>
            </div>
            <label>Enter Mobile Number or Order ID</label>
            <input type="text" id="trackQueryInput" placeholder="e.g. 9876543210">
            <button class="btn-admin-act" onclick="searchOrderStatus()">Check Status</button>
            <div id="trackResultBox" style="margin-top: 15px; font-size: 0.85rem;"></div>
        </div>
    </div>

    <!-- ADMIN PASSWORD MODAL -->
    <div id="passwordModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><span style="color: #f472b6;">🔒</span> Admin Login</h3>
                <button class="close-btn" onclick="closePasswordModal()">×</button>
            </div>
            <label>Enter Admin Passcode</label>
            <input type="password" id="adminPassInput" placeholder="Enter PIN">
            <button class="btn-admin-act" onclick="verifyAdminPassword()">Login</button>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="adminModal">
        <div class="admin-box">
            <div class="modal-header">
                <h3><i class="fas fa-user-shield"></i> Admin Panel</h3>
                <button class="close-btn" onclick="closeAdminModal()">×</button>
            </div>
            
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button class="btn-admin-act" style="margin-top:0;" onclick="switchAdminTab('orders')">Orders</button>
                <button class="btn-admin-act" style="margin-top:0; background:rgba(255,255,255,0.1);" onclick="switchAdminTab('products')">Products</button>
            </div>

            <!-- Orders Tab -->
            <div id="adminOrdersTab">
                <h4 style="font-size: 0.9rem; color: #f472b6; margin-bottom: 8px;">Live Customer Orders</h4>
                <div class="order-history-box" id="adminOrdersList"></div>
            </div>

            <!-- Products Tab -->
            <div id="adminProductsTab" style="display: none;">
                <h4 style="font-size: 0.9rem; color: #f472b6; margin-bottom: 8px;">Add New Cake</h4>
                <input type="text" id="newCakeName" placeholder="Cake Name" style="margin-bottom: 8px;">
                <input type="number" id="newCakePrice" placeholder="Base Price (₹)" style="margin-bottom: 8px;">
                <input type="text" id="newCakeImg" placeholder="Image URL" style="margin-bottom: 8px;">
                <select id="newCakeCat" style="margin-bottom: 8px;">
                    <option value="Birthday">Birthday</option>
                    <option value="Anniversary">Anniversary</option>
                    <option value="Cupcakes">Cupcakes</option>
                    <option value="Add-ons">Party Add-ons</option>
                </select>
                <button class="btn-admin-act" onclick="addNewCake()">Save & Add Cake</button>
                
                <h4 style="font-size: 0.9rem; color: #f472b6; margin: 15px 0 8px;">Manage Existing Cakes</h4>
                <div id="adminManageProductsList" style="max-height: 150px; overflow-y: auto;"></div>
            </div>

            <button onclick="closeAdminModal()" style="background: rgba(255,255,255,0.1); border: none; color: #fff; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; margin-top: 15px; cursor: pointer;">Close Panel</button>
        </div>
    </div>

    <!-- Firebase SDK Scripts (Compat Version v9.22.0) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Configuration & Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyAGExk4y_cEUSeNzLtaSCZ5XrrQ4ivztxI",
            authDomain: "priyatamcakestudio.firebaseapp.com",
            projectId: "priyatamcakestudio",
            storageBucket: "priyatamcakestudio.firebasestorage.app",
            messagingSenderId: "310909831230",
            appId: "1:310909831230:web:10ecce9bfc523f2463296f",
            measurementId: "G-3LR085K9NQ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let shopConfig = {
            name: "Priyatam Cake Studio",
            whatsapp: "916001785308",
            adminPin: "1234",
            discountPercent: 10
        };

        let defaultCakes = [
            { id: 1, name: "Belgian Chocolate Truffle", price: 650, category: "Birthday", img: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400" },
            { id: 2, name: "Red Velvet Heart Cake", price: 700, category: "Anniversary", img: "https://images.unsplash.com/photo-1586788680434-30d324b2d46f?w=400" },
            { id: 3, name: "Butterscotch Crunch", price: 550, category: "Birthday", img: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=400" },
            { id: 4, name: "Assorted Cupcakes (Box of 6)", price: 350, category: "Cupcakes", img: "https://images.unsplash.com/photo-1576618148400-f54bed99fcfd?w=400" },
            { id: 5, name: "Party Popper & Candles", price: 150, category: "Add-ons", img: "https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?w=400" },
            { id: 6, name: "Fresh Strawberry Gateau", price: 750, category: "Birthday", img: "https://images.unsplash.com/photo-1535141192574-5d4897c13136?w=400" }
        ];

        let cakes = JSON.parse(localStorage.getItem('cakes_data')) || defaultCakes;
        let cart = [];
        let appliedCoupon = null;
        let currentFilter = 'All';

        window.onload = function() {
            renderCakes();
            populateFlavorDropdown();
            updateCartUI();
            checkHolidayDate();
            loadAdminOrders();
            loadAdminManageProducts();
        };

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            renderCakes();
        }

        function renderCakes() {
            const grid = document.getElementById('cakeGridContainer');
            grid.innerHTML = '';
            let filtered = currentFilter === 'All' ? cakes : cakes.filter(c => c.category === currentFilter);
            filtered.forEach(cake => {
                grid.innerHTML += `
                    <div class="cake-card">
                        <img src="${cake.img}" alt="${cake.name}">
                        <div>
                            <h4>${cake.name}</h4>
                            <p>₹${cake.price} onwards</p>
                        </div>
                        <button class="btn-add-cart" onclick="addToCart(${cake.id})"><i class="fas fa-plus"></i> Add to Bag</button>
                    </div>
                `;
            });
        }

        function populateFlavorDropdown() {
            const select = document.getElementById('flavor');
            select.innerHTML = '';
            cakes.forEach(cake => {
                select.innerHTML += `<option value="${cake.name}" data-price="${cake.price}">${cake.name} (Base ₹${cake.price})</option>`;
            });
            calculatePrice();
        }

        function addToCart(cakeId) {
            const cake = cakes.find(c => c.id === cakeId);
            if (!cake) return;
            const existing = cart.find(item => item.id === cakeId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: cake.id, name: cake.name, price: cake.price, qty: 1 });
            }
            updateCartUI();
            showToast(`Added ${cake.name} to cart!`);
        }

        function updateCartUI() {
            const totalCount = cart.reduce((sum, i) => sum + i.qty, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            
            document.getElementById('floatingCartCount').innerText = totalCount;
            document.getElementById('floatingCartTotal').innerText = `₹${totalPrice}`;
            document.getElementById('cartModalTotal').innerText = `₹${totalPrice}`;

            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 20px;">Your shopping bag is empty.</p>`;
                return;
            }
            container.innerHTML = '';
            cart.forEach((item, index) => {
                container.innerHTML += `
                    <div class="cart-item-row">
                        <div>
                            <strong>${item.name}</strong><br>
                            <span style="color: #f472b6;">₹${item.price} × ${item.qty}</span>
                        </div>
                        <div class="cart-controls">
                            <button onclick="changeQty(${index}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="changeQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartUI();
        }

        function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; }
        function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }
        function proceedToCheckout() {
            closeCartModal();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function calculatePrice() {
            const flavorSelect = document.getElementById('flavor');
            const selectedOption = flavorSelect.options[flavorSelect.selectedIndex];
            const basePrice = selectedOption ? parseFloat(selectedOption.getAttribute('data-price')) || 650 : 650;
            
            const weightSelect = document.getElementById('weight');
            const multiplier = parseFloat(weightSelect.options[weightSelect.selectedIndex].getAttribute('data-multiplier')) || 1;
            
            let timeExtra = 0;
            const timeSelect = document.getElementById('deliveryTime');
            if (timeSelect.value.includes('Midnight')) {
                timeExtra = 150;
            }

            let total = (basePrice * multiplier) + timeExtra;
            if (appliedCoupon === 'CAKE10') {
                total = total * 0.9;
            }
            document.getElementById('totalPriceDisplay').innerText = `₹${Math.round(total)}`;
        }

        function updateLiveCakePreview() {
            const txt = document.getElementById('cakeText').value.trim();
            const previewCard = document.getElementById('liveCakePreviewCard');
            const previewDisplay = document.getElementById('previewTextDisplay');
            if (txt.length > 0) {
                previewCard.style.display = 'block';
                previewDisplay.innerText = `"${txt}"`;
            } else {
                previewCard.style.display = 'none';
            }
        }

        function checkHolidayDate() {
            const dateVal = document.getElementById('deliveryDate').value;
            const msg = document.getElementById('holidayMsg');
            if (dateVal === '2026-12-31' || dateVal === '2027-01-01') {
                msg.innerText = "🎉 New Year Eve surge pricing applicable (+₹100).";
            } else {
                msg.innerText = "";
            }
        }

        function checkPincode() {
            const pin = document.getElementById('pincodeInput').value.trim();
            const msg = document.getElementById('pincodeMsg');
            if (pin.length === 6) {
                msg.innerText = "✅ Delivery available in your area! (Standard Free Delivery)";
            } else if (pin.length > 0) {
                msg.innerText = "⚠️ Please enter a valid 6-digit PIN code.";
            } else {
                msg.innerText = "";
            }
        }

        function applyCoupon() {
            const code = document.getElementById('couponInput').value.trim().toUpperCase();
            const msg = document.getElementById('couponMsg');
            if (code === 'CAKE10') {
                appliedCoupon = 'CAKE10';
                msg.innerText = "🎉 Coupon applied successfully! 10% OFF.";
                calculatePrice();
            } else {
                appliedCoupon = null;
                msg.innerText = "❌ Invalid coupon code.";
                calculatePrice();
            }
        }

        function togglePaymentQR() {
            const method = document.getElementById('paymentMethod').value;
            const qrBox = document.getElementById('qrCodeContainer');
            if (method === 'Online') {
                qrBox.style.display = 'block';
            } else {
                qrBox.style.display = 'none';
            }
        }

        function sendWhatsAppOrder() {
            const flavor = document.getElementById('flavor').value;
            const weight = document.getElementById('weight').value;
            const cakeText = document.getElementById('cakeText').value || 'None';
            const deliveryDate = document.getElementById('deliveryDate').value || 'Not specified';
            const deliveryTime = document.getElementById('deliveryTime').value;
            const pincode = document.getElementById('pincodeInput').value || 'Not provided';
            const paymentMethod = document.getElementById('paymentMethod').value;
            const utr = document.getElementById('utrInput').value || 'N/A';
            const totalPrice = document.getElementById('totalPriceDisplay').innerText;

            const orderId = 'PCS-' + Math.floor(100000 + Math.random() * 900000);
            const orderData = {
                orderId: orderId,
                flavor: flavor,
                weight: weight,
                cakeText: cakeText,
                deliveryDate: deliveryDate,
                deliveryTime: deliveryTime,
                pincode: pincode,
                paymentMethod: paymentMethod,
                utr: utr,
                totalPrice: totalPrice,
                status: 'Order Placed (Pending)',
                timestamp: new Date().toLocaleString()
            };

            // Save order to Firebase Firestore database
            db.collection("orders").add(orderData)
              .then(() => {
                  console.log("Order successfully saved to Firebase!");
              })
              .catch((error) => {
                  console.error("Error saving order: ", error);
              });

            let msg = `*🍰 NEW CAKE ORDER - PRIYATAM STUDIO*%0A` +
                      `🆔 Order ID: ${orderId}%0A` +
                      `🎂 Flavor: ${flavor}%0A` +
                      `⚖️ Weight: ${weight}%0A` +
                      `✍️ Text: ${cakeText}%0A` +
                      `📅 Date: ${deliveryDate}%0A` +
                      `⏰ Slot: ${deliveryTime}%0A` +
                      `📍 PIN: ${pincode}%0A` +
                      `💳 Payment: ${paymentMethod} (UTR: ${utr})%0A` +
                      `💰 Total: ${totalPrice}`;

            window.open(`https://wa.me/${shopConfig.whatsapp}?text=${msg}`, '_blank');
        }

        function openTrackerModal() { document.getElementById('trackerModal').style.display = 'flex'; }
        function closeTrackerModal() { document.getElementById('trackerModal').style.display = 'none'; }
        
        function searchOrderStatus() {
            const query = document.getElementById('trackQueryInput').value.trim();
            const resultBox = document.getElementById('trackResultBox');
            if(!query) {
                resultBox.innerHTML = `<span style="color:#ef4444;">Please enter Order ID or Mobile.</span>`;
                return;
            }
            db.collection("orders").get().then((querySnapshot) => {
                let found = null;
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    if(data.orderId === query || data.pincode === query) {
                        found = data;
                    }
                });
                if(found) {
                    resultBox.innerHTML = `
                        <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-top:8px;">
                            <strong>Order:</strong> ${found.orderId}<br>
                            <strong>Cake:</strong> ${found.flavor} (${found.weight})<br>
                            <strong>Status:</strong> <span style="color:#22c55e;">${found.status}</span><br>
                            <strong>Delivery:</strong> ${found.deliveryDate} (${found.deliveryTime})
                        </div>
                    `;
                } else {
                    resultBox.innerHTML = `<span style="color:#f87171;">No active order found for "${query}".</span>`;
                }
            });
        }

        function handleTitleClick() {
            // Secret tap counter for admin login
            window.adminTapCount = (window.adminTapCount || 0) + 1;
            if (window.adminTapCount >= 5) {
                window.adminTapCount = 0;
                promptAdminPassword();
            }
        }

        function promptAdminPassword() { document.getElementById('passwordModal').style.display = 'flex'; }
        function closePasswordModal() { document.getElementById('passwordModal').style.display = 'none'; }

        function verifyAdminPassword() {
            const pin = document.getElementById('adminPassInput').value;
            if (pin === shopConfig.adminPin) {
                closePasswordModal();
                document.getElementById('adminModal').style.display = 'flex';
                loadAdminOrders();
                loadAdminManageProducts();
            } else {
                alert("Incorrect Admin Passcode!");
            }
        }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

        function switchAdminTab(tab) {
            if(tab === 'orders') {
                document.getElementById('adminOrdersTab').style.display = 'block';
                document.getElementById('adminProductsTab').style.display = 'none';
            } else {
                document.getElementById('adminOrdersTab').style.display = 'none';
                document.getElementById('adminProductsTab').style.display = 'block';
            }
        }

        function loadAdminOrders() {
            const list = document.getElementById('adminOrdersList');
            db.collection("orders").orderBy("timestamp", "desc").get().then((querySnapshot) => {
                if(querySnapshot.empty) {
                    list.innerHTML = `<p style="text-align:center; color:#94a3b8;">No orders found in cloud database.</p>`;
                    return;
                }
                list.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    let o = doc.data();
                    list.innerHTML += `
                        <div class="order-item">
                            <strong>${o.orderId}</strong> - ${o.flavor} (${o.weight})<br>
                            💰 ${o.totalPrice} | 💳 ${o.paymentMethod}<br>
                            📅 ${o.deliveryDate} | <span style="color:#38bdf8;">${o.status}</span>
                        </div>
                    `;
                });
            }).catch(error => {
                list.innerHTML = `<p style="text-align:center; color:#f87171;">Error loading cloud orders.</p>`;
            });
        }

        function addNewCake() {
            const name = document.getElementById('newCakeName').value.trim();
            const price = parseFloat(document.getElementById('newCakePrice').value);
            const img = document.getElementById('newCakeImg').value.trim();
            const category = document.getElementById('newCakeCat').value;

            if(!name || !price || !img) {
                alert("Please fill all cake details!");
                return;
            }

            const newCake = { id: Date.now(), name: name, price: price, category: category, img: img };
            cakes.push(newCake);
            localStorage.setItem('cakes_data', JSON.stringify(cakes));
            
            document.getElementById('newCakeName').value = '';
            document.getElementById('newCakePrice').value = '';
            document.getElementById('newCakeImg').value = '';

            renderCakes();
            populateFlavorDropdown();
            loadAdminManageProducts();
            alert("New cake added successfully!");
        }

        function loadAdminManageProducts() {
            const container = document.getElementById('adminManageProductsList');
            container.innerHTML = '';
            cakes.forEach((cake, index) => {
                container.innerHTML += `
                    <div class="manage-list-item">
                        <span>${cake.name} (₹${cake.price})</span>
                        <button onclick="deleteCake(${index})" style="background:#ef4444; border:none; color:#fff; padding:4px 8px; border-radius:6px; cursor:pointer;">Delete</button>
                    </div>
                `;
            });
        }

        function deleteCake(index) {
            cakes.splice(index, 1);
            localStorage.setItem('cakes_data', JSON.stringify(cakes));
            renderCakes();
            populateFlavorDropdown();
            loadAdminManageProducts();
        }

        function showToast(text) {
            const toast = document.getElementById('liveAlertToast');
            document.getElementById('toastMsg').innerText = text;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>

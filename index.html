<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Cake Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; padding: 20px; }
        .container { max-width: 420px; margin: auto; background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
        h2 { text-align: center; color: #f472b6; margin-bottom: 20px; }
        label { font-size: 0.85rem; color: #cbd5e1; display: block; margin: 12px 0 5px; font-weight: bold; }
        select, input, textarea { width: 100%; padding: 12px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 10px; font-size: 1rem; outline: none; }
        .price-box { background: rgba(236, 72, 153, 0.1); border: 1px dashed #ec4899; border-radius: 12px; padding: 15px; text-align: center; margin-top: 20px; }
        .price-box span { font-size: 1.8rem; font-weight: bold; color: #f472b6; }
        .btn-order { width: 100%; padding: 14px; background: #22c55e; color: #fff; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 15px; }
        .admin-link { text-align: center; margin-top: 25px; color: #94a3b8; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
        
        /* Admin Panel Box */
        #adminPanel { display: none; margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 12px; border: 1px solid #ec4899; }
        .btn-admin { width: 100%; padding: 10px; background: #eab308; color: #000; border: none; border-radius: 8px; font-weight: bold; margin-top: 8px; cursor: pointer; }
        .btn-close { width: 100%; padding: 10px; background: #ef4444; color: #fff; border: none; border-radius: 8px; font-weight: bold; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎂 Royal Cake Studio</h2>

        <label>Select Cake Flavor</label>
        <select id="flavor" onchange="calculateTotal()">
            <option value="Dutch Chocolate" data-price="500">Dutch Chocolate - ₹500 (0.5kg)</option>
            <option value="Red Velvet" data-price="600">Red Velvet - ₹600 (0.5kg)</option>
            <option value="Butterscotch" data-price="450">Butterscotch - ₹450 (0.5kg)</option>
            <option value="Fresh Fruit" data-price="550">Fresh Fruit - ₹550 (0.5kg)</option>
        </select>

        <label>Select Weight</label>
        <select id="weight" onchange="calculateTotal()">
            <option value="0.5 kg" data-mul="1">0.5 kg</option>
            <option value="1 kg" data-mul="1.9">1 kg</option>
            <option value="1.5 kg" data-mul="2.8">1.5 kg</option>
            <option value="2 kg" data-mul="3.6">2 kg</option>
        </select>

        <label>Message on Cake</label>
        <input type="text" id="cakeText" placeholder="e.g. Happy Birthday">

        <label>Delivery Date</label>
        <input type="date" id="deliveryDate">

        <label>Your Name</label>
        <input type="text" id="custName" placeholder="Aapka poora naam">

        <label>Delivery Address</label>
        <textarea id="custAddress" rows="2" placeholder="Poora address aur landmark"></textarea>

        <div class="price-box">
            <p>Total Amount</p>
            <span id="totalPrice">₹500</span>
        </div>

        <button class="btn-order" onclick="sendOrder()">📱 Order via WhatsApp</button>

        <div class="admin-link" onclick="openAdmin()">⚙️ Open Admin Control Panel</div>

        <!-- Hidden Admin Panel -->
        <div id="adminPanel">
            <h3 style="color: #f472b6; margin-bottom: 10px;">Admin Panel</h3>
            <label>Maintenance Mode</label>
            <button class="btn-admin" onclick="alert('Maintenance mode toggled!')">Toggle Maintenance</button>
            <button class="btn-close" onclick="closeAdmin()">Close Panel</button>
        </div>
    </div>

    <script>
        function calculateTotal() {
            let flavorSelect = document.getElementById('flavor');
            let price = parseInt(flavorSelect.options[flavorSelect.selectedIndex].getAttribute('data-price'));
            let weightSelect = document.getElementById('weight');
            let multiplier = parseFloat(weightSelect.options[weightSelect.selectedIndex].getAttribute('data-mul'));
            
            let finalPrice = Math.round(price * multiplier);
            document.getElementById('totalPrice').innerText = '₹' + finalPrice;
        }

        function openAdmin() {
            let password = prompt("Enter Admin Password (admin123):");
            if(password === "admin123") {
                document.getElementById('adminPanel').style.display = 'block';
            } else if(password !== null) {
                alert("Galat password hai!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        function sendOrder() {
            let phone = "919876543210"; // Yahan apna WhatsApp number likhein
            let flavor = document.getElementById('flavor').value;
            let weight = document.getElementById('weight').value;
            let cakeText = document.getElementById('cakeText').value || "None";
            let date = document.getElementById('deliveryDate').value;
            let name = document.getElementById('custName').value;
            let address = document.getElementById('custAddress').value;
            let price = document.getElementById('totalPrice').innerText;

            if(!name || !address || !date) {
                alert("Kripya Naam, Address aur Date zaroor bharein!");
                return;
            }

            let msg = `Hello! New Order:%0A- Flavor: ${flavor}%0A- Weight: ${weight}%0A- Text: ${cakeText}%0A- Date: ${date}%0A- Name: ${name}%0A- Address: ${address}%0A- Total: ${price}`;
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
